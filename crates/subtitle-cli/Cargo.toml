[package]
name = "subtitle-cli"
description = "Command-line entry point for subtitle-gen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "subtitle-gen"
path = "src/main.rs"

[dependencies]
clap.workspace = true
subtitle-core.workspace = true
subtitle-infer = { workspace = true }
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
serde_json.workspace = true
console.workspace = true

[features]
default = ["native", "cuda"]
native = ["subtitle-infer/native"]
cuda = ["subtitle-infer/cuda"]
vulkan = ["subtitle-infer/vulkan"]
metal = ["subtitle-infer/metal"]
