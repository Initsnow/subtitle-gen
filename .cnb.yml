.python: &python
  docker:
    image: docker.cnb.cool/examples/language/python-3:latest

# Model loading is lazy, so the test suite never touches torch or the ASR stack.
# CI installs only the dev tools plus the light runtime deps the tests import,
# instead of pulling gigabytes of CUDA libraries on every run.
.install: &install
  - name: install
    script: |
      pip install --quiet uv
      uv venv
      uv pip install --quiet --no-deps -e .
      uv pip install --quiet pytest ruff "rich>=15" "blingfire>=0.1.8"

.check: &check
  - name: lockfile
    script: uv lock --check
  - name: lint
    script: |
      uv run --no-sync ruff check .
      uv run --no-sync ruff format --check .
  - name: test
    script: uv run --no-sync pytest -q

main:
  push:
    - name: ci
      <<: *python
      stages:
        - *install
        - *check
  pull_request:
    - name: ci
      <<: *python
      stages:
        - *install
        - *check

$:
  tag_push:
    - name: publish
      <<: *python
      stages:
        - *install
        - name: build
          script: |
            uv build
            uv run --no-sync --with twine twine check dist/*
        - name: check tag against package version
          script: |
            version=$(uv run --no-sync python -c "import subtitle_gen; print(subtitle_gen.__version__)")
            if [ "${CNB_BRANCH#v}" != "$version" ]; then
              echo "Tag $CNB_BRANCH does not match version $version" >&2
              exit 1
            fi
        # Provide PYPI_TOKEN through `imports` pointing at the secret repo that
        # holds it. Without the token the step only reports the skip, so tagging
        # stays safe before publishing is set up.
        - name: upload
          script: |
            if [ -z "$PYPI_TOKEN" ]; then
              echo "PYPI_TOKEN is not set; skipping twine upload."
              exit 0
            fi
            export TWINE_USERNAME=__token__
            export TWINE_PASSWORD=$PYPI_TOKEN
            uv run --no-sync --with twine twine upload dist/*
