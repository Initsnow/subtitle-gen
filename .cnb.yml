.rust: &rust
  docker:
    image: docker.cnb.cool/examples/language/rust:latest

.rust_check: &rust_check
  - name: rust check
    script: |
      cargo clippy --workspace --all-targets -- -D warnings
      cargo test --workspace

main:
  push:
    - name: rust-ci
      <<: *rust
      stages:
        - *rust_check
  pull_request:
    - name: rust-ci
      <<: *rust
      stages:
        - *rust_check
