name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Ubuntu Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Download CrispASR native library
        run: |
          crispasr_url="https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.42/libcrispasr-linux-x86_64.tar.gz"
          download_path="$RUNNER_TEMP/libcrispasr.tar.gz"
          extract_dir="$RUNNER_TEMP/crispasr"
          curl -sSL "$crispasr_url" -o "$download_path"
          mkdir -p "$extract_dir"
          tar -xzf "$download_path" -C "$extract_dir"
          lib_dir="$extract_dir/libcrispasr-linux-x86_64/lib"
          echo "CRISPASR_LIB_DIR=$lib_dir" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$lib_dir:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          CRISPASR_LIB_DIR: ${{ env.CRISPASR_LIB_DIR }}

      - name: Run workspace tests
        run: cargo test --workspace --all-targets
        env:
          CRISPASR_LIB_DIR: ${{ env.CRISPASR_LIB_DIR }}
