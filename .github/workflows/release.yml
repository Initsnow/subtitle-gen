name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: subtitle-gen.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: subtitle-gen
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download CrispASR native library (Windows CUDA)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $crispasrUrl = "https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.42/libcrispasr-windows-x86_64-cuda.tar.gz"
          $downloadPath = "$env:RUNNER_TEMP\libcrispasr.tar.gz"
          $extractDir = "$env:RUNNER_TEMP\crispasr"
          Invoke-WebRequest -Uri $crispasrUrl -OutFile $downloadPath
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar -xzf $downloadPath -C $extractDir
          $libFile = Get-ChildItem -Path $extractDir -Recurse -File -Filter "crispasr.lib" | Select-Object -First 1
          $libDir = $libFile.DirectoryName
          echo "CRISPASR_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "CRISPASR_EXTRACT_DIR=$extractDir" >> $env:GITHUB_ENV

      - name: Download CrispASR native library (Linux CUDA)
        if: runner.os == 'Linux'
        run: |
          crispasr_url="https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.42/libcrispasr-linux-x86_64-cuda.tar.gz"
          download_path="$RUNNER_TEMP/libcrispasr.tar.gz"
          extract_dir="$RUNNER_TEMP/crispasr"
          curl -sSL "$crispasr_url" -o "$download_path"
          mkdir -p "$extract_dir"
          tar -xzf "$download_path" -C "$extract_dir"
          lib_dir=$(find "$extract_dir" -type d -name "lib" | head -n 1)
          echo "CRISPASR_LIB_DIR=$lib_dir" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$lib_dir:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p subtitle-cli

      - name: Package release artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" $stage
          if (Test-Path "$env:CRISPASR_EXTRACT_DIR") {
            Get-ChildItem -Path "$env:CRISPASR_EXTRACT_DIR" -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName $stage -Force
            }
          }
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage
          Copy-Item "config.example.toml" $stage
          $archive = "subtitle-gen-${{ matrix.target }}-cuda.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          echo "ARCHIVE_PATH=$archive" >> $env:GITHUB_ENV

      - name: Package release artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$stage/"
          if [ -d "$CRISPASR_LIB_DIR" ]; then
            cp -P "$CRISPASR_LIB_DIR"/*.so* "$stage/" 2>/dev/null || true
          fi
          cp README.md LICENSE config.example.toml "$stage/"
          archive="subtitle-gen-${{ matrix.target }}-cuda.tar.gz"
          tar -czf "$archive" -C "$stage" .
          echo "ARCHIVE_PATH=$archive" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
