[workspace]
resolver = "2"
members = [
    "crates/subtitle-core",
    "crates/subtitle-infer",
    "crates/subtitle-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-only"
repository = "https://cnb.cool/azumaseren/subtitle-gen"

[workspace.dependencies]
subtitle-core = { path = "crates/subtitle-core" }
subtitle-infer = { path = "crates/subtitle-infer" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
symphonia = { version = "0.6.1", features = [
    "mp3",
    "aac",
    "flac",
    "isomp4",
    "mkv",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
symphonia-adapter-libopus = "0.3.0"
rubato = "5.0"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
lindera = { version = "5.3", default-features = false, features = ["embed-ipadic"] }
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
async-openai = "0.27"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
sha2 = "0.10"
toml = "0.8"
futures-util = "0.3"
dirs = "6"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
